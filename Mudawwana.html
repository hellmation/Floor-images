<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface2:#EFEBE2; --surface3:#E7E1D4;
  --line:#E3DDD0; --line2:#CDC5B4;
  --ink:#1C1B19; --ink2:#5B5750; --ink3:#8E897F;
  --green:#0E6B4F; --green-ink:#0B4F3B; --green-soft:#E1EFE8;
  --red:#9F3B3B; --red-soft:#F6E7E5;
  --gold:#B5985A; --gold-soft:#F3ECDD;
  --amber:#8E6410; --amber-soft:#F7EED7;
  --blue:#2F5D8A; --blue-soft:#E4ECF4;
  --sel:#0E6B4F22;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 12px 32px -16px rgba(28,27,25,.22);
  --shadow-lg:0 24px 64px -24px rgba(28,27,25,.35);
  --r:12px; --r-sm:8px;
  --font:'IBM Plex Sans','IBM Plex Sans Arabic','Segoe UI',system-ui,Tahoma,sans-serif;
  --dur:170ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1B1B19; --surface2:#232320; --surface3:#2B2A26;
  --line:#2E2D29; --line2:#403E37;
  --ink:#ECE7DC; --ink2:#B3ADA0; --ink3:#7C7669;
  --green:#4DB18C; --green-ink:#8ED3B8; --green-soft:#16302A;
  --red:#D97E76; --red-soft:#3A2522;
  --gold:#CBB078; --gold-soft:#2F2A1F;
  --amber:#D7A74C; --amber-soft:#352B17;
  --blue:#7FA7D1; --blue-soft:#1E2A38;
  --sel:#4DB18C26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
  --shadow-lg:0 24px 64px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1B1B19; --surface2:#232320; --surface3:#2B2A26;
    --line:#2E2D29; --line2:#403E37;
    --ink:#ECE7DC; --ink2:#B3ADA0; --ink3:#7C7669;
    --green:#4DB18C; --green-ink:#8ED3B8; --green-soft:#16302A;
    --red:#D97E76; --red-soft:#3A2522;
    --gold:#CBB078; --gold-soft:#2F2A1F;
    --amber:#D7A74C; --amber-soft:#352B17;
    --blue:#7FA7D1; --blue-soft:#1E2A38;
    --sel:#4DB18C26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
    --shadow-lg:0 24px 64px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-feature-settings:"tnum" 1,"calt" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--green)}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
[lang="ar"],.ar{font-family:'IBM Plex Sans Arabic',var(--font);line-height:1.85}
.en{line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-rows:60px 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;flex:0 0 auto}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .t1{font-weight:600;font-size:15px;letter-spacing:.1px;line-height:1.1}
.brand .t2{font-size:11.5px;color:var(--ink3);line-height:1.2;margin-top:2px}
.brand .ver{font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:middle}
.searchwrap{flex:1 1 auto;display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;position:relative}
.searchwrap svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3);pointer-events:none}
#q{width:100%;height:42px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:0 44px;font-size:15px;transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
#q::-webkit-search-cancel-button{display:none}
#q:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--sel)}
.kbd{font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface2);font-family:var(--font)}
.searchwrap .kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%)}
.topactions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.ib:hover{background:var(--surface2);color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--green-soft);color:var(--green-ink)}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;background:var(--surface);transition:all var(--dur) var(--ease)}
.pill:hover{border-color:var(--ink3);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.body{display:grid;grid-template-columns:264px minmax(0,1fr) 420px;min-height:0;height:100%}
.side{border-inline-end:1px solid var(--line);overflow:auto;padding:14px 10px 40px;background:var(--bg)}
.main{overflow:auto;min-width:0;padding:22px 28px 120px;scroll-behavior:smooth;position:relative}

const Search = {
  idx: [],
  build() {
    this.idx = Store.published().map(c => {
      const sec = Store.section(c.s), sub = Store.sub(c.s, c.ss);
      const text = [c.en, c.ar, (c.tags || []).join(' '), c.cond?.en, c.cond?.ar, sec?.en, sec?.ar, sub?.en, sub?.ar].join(' ');
      const n = norm(text);
      return { id: c.id, n, toks: Array.from(new Set(n.split(' ').filter(Boolean))) };
    });
  },
  expand(q) {
    const syn = Store.bank.synonyms || {};
    return norm(q).split(' ').filter(Boolean).map(tok => {
      const alts = [tok];
      if (syn[tok]) alts.push(norm(syn[tok]));
      return alts;
    });
  },
  run(q) {
    const terms = this.expand(q); if (!terms.length) return { hits: [], terms };
    const qn = norm(q);
    const scored = [];
    for (const e of this.idx) {
      let score = 0, matchedAll = true, matchedAny = false;
      for (const alts of terms) {
        let best = 0;
        for (const a of alts) {
          if (!a) continue;
          if (e.toks.includes(a)) best = Math.max(best, 16);
          else if (e.n.includes(' ' + a) || e.n.startsWith(a)) best = Math.max(best, 12);
          else if (a.length >= 3 && e.n.includes(a)) best = Math.max(best, 7);
          else if (a.length >= 4) {
            const max = a.length >= 7 ? 2 : 1;
            for (const tk of e.toks) { if (tk.length >= 3 && lev(a, tk, max) <= max) { best = Math.max(best, 5); break; } }
          }
        }
        if (best) { score += best; matchedAny = true; } else matchedAll = false;
      }
      if (!matchedAny) continue;
      if (qn.length >= 4 && e.n.includes(qn)) score += 20;
      if (Store.user.favs.includes(e.id)) score += 2;
      score += Math.min(4, Math.log2(1 + (Store.user.usage[e.id] || 0)));
      scored.push({ id: e.id, score, all: matchedAll });
    }
    let hits = scored.filter(x => x.all);
    if (!hits.length) hits = scored;
    hits.sort((a, b) => b.score - a.score);
    return { hits, terms };
  },
  highlight(text, terms) {
    if (!terms?.length || !text) return h(text);
    const alts = terms.flat().flatMap(a => a.split(' ')).filter(a => a.length >= 3);
    return h(text).replace(/[\p{L}\p{N}%]+/gu, w => {
      const wn = norm(w);
      if (!wn) return w;
      const hit = alts.some(a => wn === a || (a.length >= 3 && wn.startsWith(a)) || (a.length >= 5 && wn.length >= 4 && lev(a, wn, a.length >= 7 ? 2 : 1) <= (a.length >= 7 ? 2 : 1)));
      return hit ? `<mark>${w}</mark>` : w;
    });
  }
};

/* ---------------- Toast ---------------- */
function toast(msg, type = 'ok', ms = 2200) {
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.innerHTML = (type === 'err' ? I.warn : I.check) + '<span>' + msg + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
}

/* ---------------- Clipboard ---------------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------------- Rendering: text with tokens ---------------- */
function renderText(text, terms, values) {
  if (!text) return '';
  const parts = []; let last = 0; let m; TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(text))) {
    parts.push(Search.highlight(text.slice(last, m.index), terms));
    const v = values && values[m[1]];
    parts.push(v ? `<span class="tok filled">${h(v)}</span>` : `<span class="tok">${h(labelOf(m[1]))}</span>`);
    last = m.index + m[0].length;
  }
  parts.push(Search.highlight(text.slice(last), terms));
  return parts.join('');
}
function labelOf(tok) { const p = (Store.bank.placeholders || {})[tok]; return p ? L(p) : tok; }

    updateCardStates();

  remove(id) { this.items = this.items.filter(x => x !== id); this.render(); updateCardStates(); },

  clear() { this.items = []; this.values = {}; this.render(); updateCardStates(); },
  tokens() { const out = []; this.items.forEach(id => { const c = Store.comment(id); if (!c) return; [...tokensOf(c.en), ...tokensOf(c.ar)].forEach(tk => { if (!out.includes(tk)) out.push(tk); }); }); return out; },

  build() {
    const out = []; const lang = this.opts.lang; const rtl = Store.bank.settings.rtlMarks ? '‏' : '';

    const block = (which) => {
      const arr = []; let n = 0;

        const c = Store.comment(id); if (!c) return;
        const txt = this.fill(which === 'en' ? c.en : c.ar); if (!txt) return; n++;
        const pre = this.opts.format === 'numbered' ? `${n}. ` : this.opts.format === 'bullets' ? '• ' : '';
        arr.push({ d: which === 'en' ? 'ltr' : 'rtl', s: (which === 'ar' ? rtl : '') + pre + txt });
      });
      return arr;
    };
    const opener = (w) => this.opts.opener && op && op[w] ? [{ d: w === 'en' ? 'ltr' : 'rtl', s: (w === 'ar' ? rtl : '') + op[w] }, { d: 'ltr', s: '' }] : [];
    const closer = (w) => this.opts.closer && cl && cl[w] ? [{ d: 'ltr', s: '' }, { d: w === 'en' ? 'ltr' : 'rtl', s: (w === 'ar' ? rtl : '') + cl[w] }] : [];
    const sep = this.opts.format === 'plain' ? [{ d: 'ltr', s: '' }] : [];
    const join = arr => arr.flatMap((l, i) => i ? [...sep, l] : [l]);
    if (lang === 'en') out.push(...opener('en'), ...join(block('en')), ...closer('en'));
    else if (lang === 'ar') out.push(...opener('ar'), ...join(block('ar')), ...closer('ar'));
    else if (lang === 'both') {
      const en = block('en'), ar = block('ar');
      out.push(...opener('en'), ...join(en), ...closer('en'));
      if (en.length && ar.length) out.push({ d: 'ltr', s: '' });
      out.push(...opener('ar'), ...join(ar), ...closer('ar'));
    } else {
      out.push(...opener('en'), ...opener('ar').slice(0, 1));

      let n = 0;
      this.items.forEach((id, i) => {

        const en = this.fill(c.en), ar = this.fill(c.ar);
        if (i) out.push({ d: 'ltr', s: '' });

        if (ar) out.push({ d: 'rtl', s: rtl + (en ? '' : pre) + ar });

/* ---------------- Scroll spy ---------------- */
function spy() {
  const main = $('#main'); if (!main || UI.q) return;
  const tops = $$('.sub-h[id], .sec-h[id]', main).map(el => ({ id: el.id, top: el.getBoundingClientRect().top }));
  const cur = tops.filter(x => x.top < 140).pop();
  $$('#side .nav a.on').forEach(a => a.classList.remove('on'));
  if (cur) { const a = $(`#side .nav a[href="#${cur.id}"]`); if (a) a.classList.add('on'); }
}

function download(name, content, type = 'text/html') {

}

  history(id) {

      for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      let i = 0, j = 0, out = ''; while (i < m && j < n) { if (A[i] === B[j]) { out += h(A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { out += `<del>${h(A[i])}</del>`; i++; } else { out += `<ins>${h(B[j])}</ins>`; j++; } }

    case 'preset-del': e.stopPropagation(); Composer.deletePreset(el.dataset.pid); break;
    case 'lang': setLang(LANG === 'en' ? 'ar' : 'en'); break;
    case 'theme': toggleTheme(); break;
    case 'help': helpDialog(); break;
    case 'suggest': suggestDialog(); break;
    case 'admin': Admin.enter(); break;
    case 'admin-browse': UI.view = 'browse'; renderMain(); break;
    case 'tray-toggle': document.body.classList.toggle('tray-open'); break;
    case 'tray-close': document.body.classList.remove('tray-open'); break;
    case 'side-toggle': document.body.classList.toggle('side-open'); break;
    case 'whats-new': whatsNewDialog(); break;
    case 'dismiss-update': Store.updateInfo = null; renderMain(); break;
    // admin
    case 'adm-new': Admin.editor(null); break;
    case 'rv-accept': Admin.acceptReview(el.dataset.rid); break;
    case 'rv-dismiss': { const r = Store.bank.reviewItems.find(x => x.id === el.dataset.rid); if (r) { r.status = 'dismissed'; Store.save(); Admin.render($('#main')); } break; }
    case 'sug-accept': { const s = Store.bank.suggestions.find(x => x.id === el.dataset.sid); if (s) { Store.bank.comments.push({ id: uid('c'), s: s.s, ss: s.ss, kind: 'request', en: s.en, ar: s.ar, tags: [], status: 'draft', history: [], note: `Suggested by ${s.by || 'reviewer'}: ${s.why || ''}`, createdAt: nowIso() }); s.status = 'accepted'; Store.save(); toast('Draft created'); Admin.render($('#main')); } break; }
    case 'sug-dismiss': { const s = Store.bank.suggestions.find(x => x.id === el.dataset.sid); if (s) { s.status = 'dismissed'; Store.save(); Admin.render($('#main')); } break; }
    case 'sec-add': { const en = prompt('Section name (English)'); if (!en) return; const ar = prompt('Section name (Arabic)') || en; Store.bank.sections.push({ id: uid('s'), en, ar, subsections: [{ id: uid('ss'), en: 'General', ar: 'عام' }] }); Store.save(); Admin.render($('#main')); break; }
    case 'sub-add': { const s = Store.section(el.dataset.sid); const en = prompt('Subsection name (English)'); if (!en) return; const ar = prompt('Subsection name (Arabic)') || en; s.subsections.push({ id: uid('ss'), en, ar }); Store.save(); Admin.render($('#main')); break; }
    case 'sec-move': { const arr = Store.bank.sections; const i = arr.findIndex(x => x.id === el.dataset.sid), j = i + Number(el.dataset.dir); [arr[i], arr[j]] = [arr[j], arr[i]]; Store.save(); Admin.render($('#main')); break; }
    case 'sub-move': { const arr = Store.section(el.dataset.sid).subsections; const i = arr.findIndex(x => x.id === el.dataset.ssid), j = i + Number(el.dataset.dir); [arr[i], arr[j]] = [arr[j], arr[i]]; Store.save(); Admin.render($('#main')); break; }
    case 'sec-save': { $$('[data-sec-en]').forEach(i => Store.section(i.dataset.secEn).en = i.value.trim()); $$('[data-sec-ar]').forEach(i => Store.section(i.dataset.secAr).ar = i.value.trim()); $$('[data-sub-en]').forEach(i => { const [s, ss] = i.dataset.subEn.split('/'); Store.sub(s, ss).en = i.value.trim(); }); $$('[data-sub-ar]').forEach(i => { const [s, ss] = i.dataset.subAr.split('/'); Store.sub(s, ss).ar = i.value.trim(); }); Store.save(); Search.build(); toast(t('toast_saved')); break; }
    case 'lines-save': { $$('[data-line]').forEach(ta => { const [k, id2, l] = ta.dataset.line.split('/'); const o = Store.bank[k].find(x => x.id === id2); if (o) o[l] = ta.value.trim(); }); Store.save(); toast(t('toast_saved')); break; }
    case 'an-export': download(`mudawwana-analytics-${today()}.json`, JSON.stringify({ usage: Store.user.usage, zeroHits: Store.user.zeroHits, exportedAt: nowIso(), by: Store.user.name }, null, 2), 'application/json'); break;
    case 'an-reset': if (confirm('Reset usage statistics in this browser?')) { Store.user.usage = {}; Store.user.zeroHits = []; Store.saveUser(); Admin.render($('#main')); } break;
    case 'st-save': {
      Store.bank.appName = { en: $('#st-name-en').value.trim(), ar: $('#st-name-ar').value.trim() }; Store.bank.subtitle = { en: $('#st-sub-en').value.trim(), ar: $('#st-sub-ar').value.trim() };
      Store.bank.settings.charLimit = Number($('#st-limit').value) || 0; Store.bank.settings.rtlMarks = $('#st-rtl').checked; Store.user.name = $('#st-me').value.trim();
      const np = $('#st-pass').value; if (np) Store.bank.settings.adminHash = await hashText(np);
      Store.save(); Store.saveUser(); toast(t('toast_saved')); renderShell(); break; }
    case 'st-logo-clear': Store.bank.settings.logo = ''; Store.save(); renderShell(); break;
    case 'pb-download': Admin.publish(); break;
    case 'pb-json': download(`mudawwana-bank-v${Store.bank.version}.json`, JSON.stringify(Store.bank, null, 2), 'application/json'); break;
    case 'pb-reset': if (confirm('Discard all local edits and return to the embedded bank?')) { localStorage.removeItem(KEY.bank); location.reload(); } break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { UI.q = el.value; renderMainDebounced(); return; }
  if (el.dataset.tok !== undefined) { Composer.values[el.dataset.tok] = el.value; el.classList.toggle('miss', !el.value); refreshPreview(); return; }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.optChk) { Composer.opts[el.dataset.optChk] = el.checked; Composer.render(); } if (el.dataset.tok !== undefined && el.tagName === 'SELECT') { Composer.values[el.dataset.tok] = el.value; Composer.render(); } });
const renderMainDebounced = debounce(() => { renderMain(); $('#main').scrollTop = 0; }, 60);
function refreshPreview() { // light update without re-rendering inputs
  const lines = Composer.build(); const pv = $('#preview'); if (!pv) return;
  pv.innerHTML = lines.map(l => `<span class="${l.d === 'rtl' ? 'arl' : 'enl'}" ${l.d === 'rtl' ? 'lang="ar"' : ''}>${h(l.s) || '&nbsp;'}</span>`).join('');
  const txt = lines.map(l => l.s).join('\n'); const limit = Store.bank.settings.charLimit || 0; const meta = $('.tray .meta'); if (meta) meta.innerHTML = `<span>${txt.length.toLocaleString()} ${t('chars')}${limit ? ` · ${t('limit')} ${limit.toLocaleString()}` : ''}</span>${limit && txt.length > limit ? `<span class="over">${t('over_limit')}</span>` : ''}`;
  const warns = Composer.warnings(); $$('.tray .warn').forEach(w => w.remove()); if (meta) meta.insertAdjacentHTML('afterend', warns.map(w => `<div class="warn ${w.c}">${I.warn}<span>${w.m}</span></div>`).join(''));
}
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName; const typing = /INPUT|TEXTAREA|SELECT/.test(tag) && document.activeElement.id !== 'q';
  const inDialog = !!$('dialog[open]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); Composer.copy(); return; }
  if (inDialog) return;
  if (e.key === 'Escape') { if (document.activeElement.id === 'q' && UI.q) { UI.q = ''; $('#q').value = ''; renderMain(); } else if (document.body.classList.contains('tray-open')) document.body.classList.remove('tray-open'); else { document.activeElement.blur(); } return; }
  if (typing) return;
  if (e.key === '/' ) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === '?' && document.activeElement.id !== 'q') { helpDialog(); return; }
  if (UI.view === 'admin') return;
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(UI.visible.length - 1, UI.active + 1)); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, UI.active - 1)); return; }
  if (e.key === 'Enter' && UI.active >= 0) { e.preventDefault(); Composer.add(UI.visible[UI.active]); return; }
  if (e.key === ' ' && UI.active >= 0 && document.activeElement.id !== 'q') { e.preventDefault(); previewDialog(UI.visible[UI.active]); return; }
  if (/^[1-9]$/.test(e.key) && document.activeElement.id !== 'q' && !UI.q) { const s = Store.bank.sections[Number(e.key) - 1]; if (s) $(`#sec-${s.id}`)?.scrollIntoView({ behavior: 'smooth' }); return; }
});
document.addEventListener('focusin', e => { const card = e.target.closest?.('.card'); if (card) { const i = UI.visible.indexOf(card.dataset.id); if (i >= 0) setActive(i, false); } });

/* ---------------- Self test ---------------- */
function selfTest() {
  const R = []; const ok = (name, cond, extra = '') => R.push({ name, pass: !!cond, extra });
  ok('norm: hamza/taa/yaa', norm('أحمد الإمارة إلى') === 'احمد الاماره الي');
  ok('norm: diacritics + tatweel', norm('يُرجـــى') === 'يرجي');
  ok('norm: arabic digits', norm('٢٥%') === '25%');
  ok('tokens: extraction', JSON.stringify(tokensOf('a {{tin}} b {{ tradeLicenseNo }} {{tin}}')) === '["tin","tradeLicenseNo"]');
  const expected = { 'entity-type': 19, doi: 8, natural: 6, commence: 1, authority: 12, 'tl-number': 2, 'issue-date': 2, 'expiry-date': 6, names: 2, activity: 1, owners: 8, 'branch-main': 4, address: 6, 'signatory-list': 3, 'tin-main': 1, dereg: 5, 'change-type': 1 };
  for (const [ss, n] of Object.entries(expected)) { const got = EMBED.comments.filter(c => c.ss === ss).length; ok(`seed: ${ss} = ${n}`, got === n, got !== n ? `got ${got}` : ''); }
  ok('seed: total 87', EMBED.comments.length === 87, `got ${EMBED.comments.length}`);
  ok('seed: unique ids', new Set(EMBED.comments.map(c => c.id)).size === EMBED.comments.length);
  ok('seed: every comment maps to a subsection', EMBED.comments.every(c => Store.sub(c.s, c.ss)));
  ok('seed: EN/AR token parity', EMBED.comments.every(c => !c.ar || JSON.stringify(tokensOf(c.en).sort()) === JSON.stringify(tokensOf(c.ar).sort())));
  const first = q => Search.run(q).hits[0]?.id; const has = (q, id) => Search.run(q).hits.some(x => x.id === id);
  ok('search: "expired eid" → np-04', first('expired eid') === 'np-04', first('expired eid'));
  ok('search: "هوية منتهية" → np-04', first('هوية منتهية') === 'np-04', first('هوية منتهية'));
  ok('search: "moa" finds doi-05', has('moa', 'doi-05'));
  ok('search: "jafza" finds au-08 & led-06', has('jafza', 'au-08') && has('jafza', 'led-06'));
  ok('search: typo "incorporaton" finds doi-01', has('incorporaton', 'doi-01'));
  ok('search: "رخصه منتهيه" finds led-03', has('رخصه منتهيه', 'led-03') || has('رخصه حديثه', 'led-03'));
  const t0 = performance.now(); for (let i = 0; i < 200; i++) Search.run(['expired eid', 'moa', 'هوية', 'trade licence number', 'rejected sole'][i % 5]); const per = (performance.now() - t0) / 200;
  ok(`perf: search ${per.toFixed(2)} ms avg (< 50)`, per < 50);
  const saved = { items: Composer.items, values: Composer.values, opts: { ...Composer.opts } };
  Composer.items = ['lid-02', 'np-04']; Composer.values = { date: '2026-01-15' }; Composer.opts = { lang: 'both', format: 'numbered', opener: false, closer: false };
  const out = Composer.text();
  ok('composer: numbered EN then AR', out.startsWith('1. Kindly amend the license issue date to (15/01/2026).\n2. Kindly attach') && out.includes('\n\n‏1. يرجى تعديل تاريخ اصدار الرخصة الى (15/01/2026).'), JSON.stringify(out.slice(0, 80)));
  Composer.opts.lang = 'inter'; const out2 = Composer.text();
  ok('composer: interleaved pairs', out2.split('\n\n').length === 2 && out2.includes('\n‏يرجى'));
  Composer.items = ['dr-01', 'dr-02']; ok('guard: multiple rejections', Composer.warnings().some(w => w.m === t('w_multi_rej')));
  Composer.items = ['dr-01', 'ad-01']; ok('guard: mix rejection + request', Composer.warnings().some(w => w.m === t('w_mix')));
  Object.assign(Composer, saved); Composer.render();
  const html = buildHtml(Store.bank); ok('publish: self-serialisation round-trips', html.includes('id="bank"') && html.includes('"comments"') && /<div id="app"><\/div>/.test(html), `${(html.length / 1024).toFixed(0)} KB`);
  ok('sha256: known vector', sha256('admin') === '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918');
  const pass = R.filter(r => r.pass).length;
  const box = document.createElement('div'); box.className = 'selftest'; box.innerHTML = `<h4>Self-test · ${pass}/${R.length} passed</h4>` + R.map(r => `<div><span class="${r.pass ? 'ok' : 'fail'}">${r.pass ? '✓' : '✗'}</span><span>${h(r.name)}</span><span class="vtag" style="margin-inline-start:auto">${h(r.extra)}</span></div>`).join('') + `<div style="border:0;margin-top:8px"><button class="btn sec" onclick="this.closest('.selftest').remove()">Close</button></div>`;
  document.body.appendChild(box);
  window.__selftest = R;
}

/* ---------------- Boot ---------------- */
Store.load(); LANG = Store.user.lang; document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr'; applyTheme();
Search.build(); renderShell();
$('#main').addEventListener('scroll', debounce(spy, 60));
$('#q').focus();
if (location.hash === '#selftest') setTimeout(selfTest, 50);
window.Mudawwana = { Store, Search, Composer, norm, selfTest, buildHtml };
})();
