<style>
:root{
  /* FTA Brand Manual: Red 186C #C8102E · Green 348C #00843D · Black · Gold 8960C #B68A35 · Blue 647C #306190 · Grey 877C #C6C6C6 */
  --bg:#F6F5F2; --surface:#FFFFFF; --surface2:#EFEEEA; --surface3:#E6E4DF;
  --line:#E2E0DA; --line2:#C6C6C6;
  --ink:#111111; --ink2:#4F4F4F; --ink3:#8A8A8A;
  --green:#00843D; --green-ink:#00622D; --green-soft:#E0F1E7;
  --red:#C8102E; --red-soft:#F9E3E6;
  --gold:#B68A35; --gold-soft:#F4ECDC;
  --amber:#8A6520; --amber-soft:#F6EEDA;
  --blue:#306190; --blue-soft:#E3EAF2;
  --sel:#0E6B4F22;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 12px 32px -16px rgba(28,27,25,.22);
  --shadow-lg:0 24px 64px -24px rgba(28,27,25,.35);
  --e1:none; --e2:0 1px 2px rgba(28,27,25,.05),0 10px 28px -16px rgba(28,27,25,.22); --e3:0 24px 64px -24px rgba(28,27,25,.35),0 2px 6px rgba(28,27,25,.06);
  --r:12px; --r-sm:8px;
  --font:'IBM Plex Sans','IBM Plex Sans Arabic','Segoe UI',system-ui,Tahoma,sans-serif;
  --font-ar-display:'Noto Kufi Arabic','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --dur:170ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1A1A1A; --surface2:#222222; --surface3:#2A2A2A;
  --line:#2C2C2C; --line2:#3E3E3E;
  --ink:#EDEDEA; --ink2:#B4B4B0; --ink3:#7E7E7A;
  --green:#25A15C; --green-ink:#7FD6A6; --green-soft:#12301F;
  --red:#E3566B; --red-soft:#3A1E23;
  --gold:#CFAA5E; --gold-soft:#2F2A1F;
  --amber:#D7A74C; --amber-soft:#352B17;
  --blue:#7FA7D1; --blue-soft:#1E2A38;
  --sel:#4DB18C26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
  --shadow-lg:0 24px 64px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1A1A1A; --surface2:#222222; --surface3:#2A2A2A;
    --line:#2C2C2C; --line2:#3E3E3E;
    --ink:#EDEDEA; --ink2:#B4B4B0; --ink3:#7E7E7A;
    --green:#25A15C; --green-ink:#7FD6A6; --green-soft:#12301F;
    --red:#E3566B; --red-soft:#3A1E23;
    --gold:#CFAA5E; --gold-soft:#2F2A1F;
    --amber:#D7A74C; --amber-soft:#352B17;
    --blue:#7FA7D1; --blue-soft:#1E2A38;
    --sel:#4DB18C26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
    --shadow-lg:0 24px 64px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-feature-settings:"tnum" 1,"calt" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--green)}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
[lang="ar"],.ar{font-family:'IBM Plex Sans Arabic',var(--font);line-height:1.85}
/* Arabic display face (Noto Kufi Arabic) for headings, titles and service names — body comments stay in Plex Arabic */
.ar-t,.hero .svc-ar,.svclist .ar,.svcbtn .nm2,.scen .sc .ar,#splash .ar-name,.release b[lang="ar"],.rv .t .ar{font-family:var(--font-ar-display)}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .hero h1,html[dir="rtl"] .sec-h h2,html[dir="rtl"] .sub-h,html[dir="rtl"] .svcbtn .nm,html[dir="rtl"] .brand .one,html[dir="rtl"] .dlg-h h3,html[dir="rtl"] .tray-h h3,html[dir="rtl"] .side h4,html[dir="rtl"] .pane h2,html[dir="rtl"] #splash .eyebrow,html[dir="rtl"] #splash .start,html[dir="rtl"] .svclist .en,html[dir="rtl"] .scen .sc b,html[dir="rtl"] .svc-empty b,html[dir="rtl"] .empty b{font-family:var(--font-ar-display)}
html[dir="rtl"] .sub-h{letter-spacing:0;text-transform:none;font-size:13px}
html[dir="rtl"] #splash .eyebrow{letter-spacing:.04em!important}
html[dir="rtl"] .sec-h h2{font-weight:600}
.en{line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
#app{display:grid;grid-template-rows:60px 1fr;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;flex:0 0 auto}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .t1{font-weight:600;font-size:15px;letter-spacing:.1px;line-height:1.1}
@media (max-width:820px){.brand .one span{display:none}}
.brand .t2{font-size:11.5px;color:var(--ink3);line-height:1.2;margin-top:2px}
.brand .ver{font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:middle}
.searchwrap{flex:1 1 auto;display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;position:relative}
.searchwrap svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3);pointer-events:none}
#q{width:100%;height:42px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:0 44px;font-size:15px;transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
#q::-webkit-search-cancel-button{display:none}
#q:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--sel)}
.kbd{font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface2);font-family:var(--font)}
.searchwrap .kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%)}
.topactions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.ib:hover{background:var(--surface2);color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--green-soft);color:var(--green-ink)}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;background:var(--surface);transition:all var(--dur) var(--ease)}
.pill:hover{border-color:var(--ink3);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.body{display:grid;grid-template-columns:264px minmax(0,1fr) 420px;min-height:0;height:100%}
.side{border-inline-end:1px solid var(--line);overflow:auto;padding:14px 10px 40px;background:var(--bg)}
.main{overflow:auto;min-width:0;padding:22px 28px 120px;scroll-behavior:smooth;position:relative}
.tray{border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}

@media (max-width:1180px){
  .body{grid-template-columns:232px minmax(0,1fr)}
  .tray{position:fixed;inset-block:60px 0;inset-inline-end:0;width:min(440px,100vw);box-shadow:var(--shadow-lg);transform:translateX(var(--tx,110%));transition:transform 240ms var(--ease);z-index:20}
  html[dir="rtl"] .tray{--tx:-110%}
  body.tray-open .tray{--tx:0}
  #trayToggle{display:grid!important}
}
@media (max-width:820px){
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:60px 0;inset-inline-start:0;width:264px;z-index:19;box-shadow:var(--shadow-lg);transform:translateX(var(--sx,-110%));transition:transform 240ms var(--ease)}
  html[dir="rtl"] .side{--sx:110%}
  body.side-open .side{--sx:0}
  #sideToggle{display:grid!important}
  .main{padding:16px 16px 140px}
  .brand .t2{display:none}
}
#trayToggle,#sideToggle{display:none}

/* ---------- Sidebar ---------- */
.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin:16px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:13px;transition:background var(--dur) var(--ease)}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav a .n{margin-inline-start:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav a .k{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:0 4px;min-width:16px;text-align:center}
.nav .sub a{padding-inline-start:30px;font-size:12.5px}
.nav .sec>a{font-weight:500}
.side .mini{display:flex;flex-wrap:wrap;gap:5px;padding:0 8px}
.side .mini button{font-size:11.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all var(--dur) var(--ease)}
.side .mini button:hover{border-color:var(--ink3);color:var(--ink)}

/* ---------- Main ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.hero h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.2px}
.hero p{margin:4px 0 0;color:var(--ink3);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;transition:all var(--dur) var(--ease)}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.gold-rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:6px 0 18px;opacity:.7}
.sec-h{position:sticky;top:-22px;z-index:2;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 0 10px;margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.sec-h h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.1px}
.sec-h .ar-t{color:var(--ink3);font-size:13px}
.sec-h .cnt{margin-inline-start:auto;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600;margin:14px 2px 8px;display:flex;gap:8px;align-items:baseline}
.sub-h .ar-t{text-transform:none;letter-spacing:0;font-weight:400}
.grid{display:grid;gap:10px}
.empty{text-align:center;color:var(--ink3);padding:70px 20px}
.empty b{display:block;color:var(--ink2);font-size:15px;font-weight:500;margin-bottom:6px}

/* ---------- Card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease);position:relative}
.card:hover{border-color:var(--line2);box-shadow:var(--e2);transform:translateY(-1px)}
.card .btn.pri{transition:all 180ms cubic-bezier(.34,1.3,.5,1)}
.card.in .btn.pri{transform:scale(1.02)}
.card.active{border-color:var(--green);box-shadow:0 0 0 3px var(--sel),var(--shadow)}
.card.in{border-inline-start:3px solid var(--green)}
.card.flash{animation:flash 600ms var(--ease)}
@keyframes flash{0%{background:var(--green-soft)}100%{background:var(--surface)}}
.card-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:22px}
.crumb{font-size:11.5px;color:var(--ink3);margin-inline-end:auto}
.crumb b{font-weight:500;color:var(--ink2)}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px;line-height:1.5}
.badge svg{width:12px;height:12px;flex:0 0 auto}
.b-cond{max-width:100%;white-space:normal;text-align:start}
.b-request{background:var(--green-soft);color:var(--green-ink)}
.b-attachment{background:var(--blue-soft);color:var(--blue)}
.b-rejection{background:var(--red-soft);color:var(--red)}
.b-notice{background:var(--gold-soft);color:var(--gold)}
.b-cond{background:var(--amber-soft);color:var(--amber);text-transform:none;letter-spacing:0;font-weight:500}
.b-flag{background:var(--amber-soft);color:var(--amber);text-transform:none;letter-spacing:0;font-weight:500}
.b-draft{background:var(--surface3);color:var(--ink2)}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card-body p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.card-body .en{color:var(--ink)}
.card-body .ar{color:var(--ink);font-size:14px}
html[dir="rtl"] .card-body .ar{order:-1}
.card-body .none{color:var(--ink3);font-style:italic;font-size:12.5px}
.card.clamp .card-body p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .more{font-size:12px;color:var(--green);margin-top:4px;font-weight:500}
@media (max-width:1400px){.card-body{grid-template-columns:1fr}}
.card-f{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.card-f .sp{flex:1}
.tok.filled{background:var(--green-soft);color:var(--green-ink);border-style:solid}
.tok{background:var(--gold-soft);color:var(--amber);border-radius:5px;padding:0 5px;font-weight:500;font-size:.92em;border:1px dashed color-mix(in srgb,var(--gold) 60%,transparent)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.btn{height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);border:1px solid transparent;transition:all var(--dur) var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface2);color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-ink)}
:root[data-theme="dark"] .btn.pri,:root:not([data-theme="light"]) .btn.pri{color:#0b1f18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
:root[data-theme="light"] .btn.pri{color:#fff}
.btn.sec{border-color:var(--line2);background:var(--surface)}
.btn.sec:hover{border-color:var(--ink3)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.lg{height:38px;padding:0 16px;font-size:13.5px;border-radius:10px}
.star{color:var(--ink3)}
.star.on{color:var(--gold)}
.star svg{width:16px;height:16px}

/* ---------- Tray / Composer ---------- */
.tray-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.tray-h h3{margin:0;font-size:14px;font-weight:600}
.tray-h .n{background:var(--green);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;font-weight:600}
.tray-h .sp{flex:1}
.tray-h .mini-copy{height:30px;padding:0 10px;border-radius:8px;background:var(--green);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tray-h .mini-copy svg{width:14px;height:14px}
.tray-h .cc{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tray-b{flex:1;overflow:auto;padding:12px 16px}
.tray-f{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface)}
.tray .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);font-weight:600;margin:14px 0 8px}
.citem.out{animation:leave 180ms var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:translateX(12px) scale(.98);height:0;margin:0;padding:0}}
.citem{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 6px;margin-bottom:6px;transition:all var(--dur) var(--ease);animation:settle 260ms var(--ease)}
@keyframes settle{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.citem.drag{opacity:.4}
.citem.over{border-color:var(--green);box-shadow:0 0 0 2px var(--sel)}
.citem .h{cursor:grab;color:var(--ink3);padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.citem .h svg{width:14px;height:14px}
.citem .num{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;width:16px;text-align:center}
.citem .tx{flex:1;min-width:0;font-size:12.5px}
.citem .tx .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.citem .tx .m{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.citem .x{color:var(--ink3);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.citem .x:hover{background:var(--red-soft);color:var(--red)}
.citem .x svg{width:14px;height:14px}
.fields{display:grid;gap:8px}
.field label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px;font-weight:500}
.field input,.field select,.field textarea{width:100%;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:0 10px;font-size:13px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.field textarea{height:auto;min-height:80px;padding:8px 10px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--sel)}
.field input.miss{border-color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:2px;background:var(--surface2);gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--ink2);font-weight:500;transition:all var(--dur) var(--ease)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.check input{accent-color:var(--green);width:15px;height:15px;margin:0}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:90px;max-height:320px;overflow:auto;line-height:1.75}
.preview .arl{direction:rtl;text-align:right;display:block;font-family:'IBM Plex Sans Arabic',var(--font)}
.preview .enl{direction:ltr;text-align:left;display:block}
.preview .tok{font-size:.9em}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3);margin-top:6px;font-variant-numeric:tabular-nums}
.meta .over{color:var(--red);font-weight:600}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:12px;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.5}
.warn.amber{background:var(--amber-soft);color:var(--amber)}
.warn.red{background:var(--red-soft);color:var(--red)}
.warn svg{width:14px;height:14px;flex:0 0 auto;margin-top:2px}
.tray-f .row{display:flex;gap:8px;align-items:center}
.tray-f .row .sp{flex:1}
.copybtn{flex:1;justify-content:center}
.copybtn{position:relative;overflow:hidden}
.copybtn::after{content:'';position:absolute;inset:0;background:var(--green-ink);transform:scaleX(0);transform-origin:0 50%;transition:transform 420ms var(--ease);z-index:0}
.copybtn.done::after{transform:scaleX(1)}
.copybtn>*{position:relative;z-index:1}
.copybtn.done{background:var(--green)}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.presets button{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:all var(--dur) var(--ease)}
.presets button:hover{border-color:var(--ink3);color:var(--ink)}
.presets button i{font-style:normal;color:var(--ink3)}
.presets button i:hover{color:var(--red)}
.tray-empty{color:var(--ink3);text-align:center;padding:36px 12px;font-size:13px;line-height:1.7}
.tray-empty .kbd{margin:0 2px}

/* ---------- Quality meter ---------- */
.qm{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.qm .hd span{display:inline-flex;align-items:center;gap:5px}.qm .hd svg{width:13px;height:13px;color:var(--green)}
.qm .bar{height:5px;border-radius:999px;background:var(--surface3);overflow:hidden;margin:6px 0 0}
.qm ul{margin-top:8px}
.qm .bar i{display:block;height:100%;border-radius:999px;transition:width 420ms var(--ease),background 300ms}
.qm .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.qm .hd b{font-variant-numeric:tabular-nums}
.qm ul{margin:0;padding:0;list-style:none;font-size:11.5px;color:var(--ink2);display:grid;gap:3px}
.qm li{display:flex;gap:6px;align-items:flex-start}
.qm li svg{width:12px;height:12px;flex:0 0 auto;margin-top:3px}
.qm li.ok{color:var(--ink3)} .qm li.ok svg{color:var(--green)} .qm li.bad svg{color:var(--red)} .qm li.warn svg{color:var(--amber)}
.qm.g .bar i{background:var(--green)} .qm.a .bar i{background:var(--amber)} .qm.r .bar i{background:var(--red)}
.sugg{display:flex;flex-wrap:wrap;gap:5px}
.sugg button{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all var(--dur) var(--ease)}
.sugg button:hover{border-style:solid;border-color:var(--green);color:var(--green-ink)}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scen .sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:all var(--dur) var(--ease)}
.scen .sc:hover{border-color:var(--green);box-shadow:var(--e2);transform:translateY(-1px)}
.scen .sc b{font-size:13.5px}
.scen .sc .ar{font-size:12.5px;color:var(--ink2)}
.scen .sc .n{font-size:11px;color:var(--ink3);margin-top:2px}
.scen .sc .acts{display:flex;gap:4px;margin-top:4px}
/* ---------- Command palette ---------- */
#palette{position:fixed;inset:0;z-index:400;background:rgba(20,19,17,.42);backdrop-filter:blur(3px);display:grid;place-items:start center;padding-top:12vh}
#palette .box{width:min(640px,calc(100vw - 32px));background:var(--surface);border-radius:16px;box-shadow:var(--e3);overflow:hidden;border:1px solid var(--line)}
#palette input{width:100%;height:54px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 18px;font-size:16px;outline:none}
#palette .list{max-height:52vh;overflow:auto;padding:6px}
#palette .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer}
#palette .it.on{background:var(--green-soft);color:var(--green-ink)}
#palette .it .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);width:70px;flex:0 0 auto}
#palette .it .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#palette .it .kbd{margin-inline-start:auto}
#palette .ft{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);display:flex;gap:14px}
/* ---------- Tour ---------- */
#tour{position:fixed;inset:0;z-index:350;pointer-events:none}
#tour .dim{position:absolute;inset:0;background:rgba(20,19,17,.5);pointer-events:auto;transition:clip-path 300ms var(--ease)}
#tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,19,17,.55),0 0 0 3px var(--green);transition:all 320ms var(--ease);pointer-events:none}
#tour .card{position:absolute;width:320px;background:var(--surface);border-radius:14px;box-shadow:var(--e3);padding:16px 18px;pointer-events:auto;transition:all 320ms var(--ease)}
#tour .card:hover{transform:none}
#tour .card .st{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:6px}
#tour .card h4{margin:0 0 6px;font-size:15px}
#tour .card p{margin:0 0 12px;font-size:13px;color:var(--ink2);line-height:1.6}
#tour .card .acts{display:flex;gap:6px;justify-content:flex-end}
/* ---------- Presentation mode ---------- */
body.present{font-size:16px}
body.present .topactions [data-act="admin"],body.present .topactions [data-act="suggest"]{display:none}
body.present .card-body p{font-size:15.5px} body.present .card-body .ar{font-size:16.5px}
body.present .brand .t1{font-size:17px}
/* ---------- Banners ---------- */
.sysbanner{background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center}
.sysbanner.red{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.sysbanner .sp{flex:1}
/* ---------- Splash extras ---------- */
#splash .inner>*{animation:rise 620ms var(--ease) both}
#splash .inner>:nth-child(1){animation-delay:0ms}#splash .inner>:nth-child(2){animation-delay:120ms}#splash .inner>:nth-child(3){animation-delay:200ms}#splash .inner>:nth-child(4){animation-delay:280ms}#splash .inner>:nth-child(5){animation-delay:340ms}#splash .inner>:nth-child(6){animation-delay:400ms}#splash .inner>:nth-child(7){animation-delay:470ms}#splash .inner>:nth-child(8){animation-delay:560ms}#splash .inner>:nth-child(9){animation-delay:700ms}#splash .inner>:nth-child(10){animation-delay:780ms}#splash .inner>:nth-child(11){animation-delay:860ms}
#splash.fast .inner>*{animation:none}
#splash .strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:8px 0 0}
#splash .strip span{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:color-mix(in srgb,var(--surface) 70%,transparent)}
#splash .strip span b{color:var(--ink);font-variant-numeric:tabular-nums}
#splash .strip span.new{border-color:var(--green);color:var(--green-ink);background:var(--green-soft)}
#splash .meta2{font-size:11.5px;color:var(--ink3);margin-top:10px}
#splash .quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
/* ---------- Print ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:18mm 16mm 20mm;@bottom-center{content:counter(page);font-family:'IBM Plex Sans',sans-serif;font-size:9pt;color:#777}}
  html,body{overflow:visible!important;height:auto!important;background:#fff!important;color:#111!important}
  #app,#splash,#overlays,#toasts,#palette,#tour,.selftest{display:none!important}
  #print{display:block;font-size:10.5pt;line-height:1.5}
  #print .cover{height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
  #print .cover img{width:130px;margin-bottom:28px}
  #print .cover h1{font-size:30pt;margin:0 0 6px;letter-spacing:-.5px}
  #print .cover .ar{font-size:20pt;color:#0E6B4F;margin-bottom:18px}
  #print .cover .meta{color:#666;font-size:10pt;margin-top:30px}
  #print .toc{page-break-after:always}
  #print .toc h2{font-size:16pt;margin:0 0 12px}
  #print .toc ol{padding-inline-start:20px;columns:2;column-gap:28px}
  #print .toc li{margin:3px 0;font-size:10pt}
  #print .toc li small{color:#888}
  #print h2.sec{font-size:15pt;margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid #0E6B4F;page-break-after:avoid;page-break-before:always;display:flex;justify-content:space-between;align-items:baseline}
  #print h2.sec:first-of-type{page-break-before:auto}
  #print h3.sub{font-size:11pt;margin:14px 0 6px;color:#0E6B4F;letter-spacing:.06em;text-transform:uppercase;page-break-after:avoid;display:flex;justify-content:space-between}
  #print h3.sub span{text-transform:none;letter-spacing:0;color:#666;font-weight:400}
  #print .pc{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;padding:7px 0;border-bottom:1px solid #e4e4e4;page-break-inside:avoid}
  #print .pc .en{direction:ltr} #print .pc .ar{direction:rtl;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif}
  #print .pc .cond{grid-column:1/-1;font-size:9pt;color:#8E6410}
  #print .pc .id{font-family:ui-monospace,monospace;font-size:8pt;color:#aaa}
  #print .tok{border:1px dashed #B5985A;border-radius:3px;padding:0 3px;background:none;color:#8E6410}
}
/* ---------- Bulk grid ---------- */
.grid-tbl td[contenteditable]{min-width:220px;outline:none;border-radius:4px}
.grid-tbl td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--green)}
.grid-tbl td.dirty{background:var(--amber-soft)}
.cov{border-collapse:collapse;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cov th,.cov td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center}
.cov th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);background:var(--bg)}
.cov td:first-child,.cov th:first-child{text-align:start}

/* ---------- Splash / home (Seven Threads) ---------- */
#splash{position:fixed;inset:0;z-index:300;display:grid;grid-template-rows:1fr auto;background:var(--bg);color:var(--ink);transition:opacity 420ms var(--ease),visibility 420ms;overflow:hidden;--sease:cubic-bezier(.16,1,.3,1)}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .field{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 900ms ease}
#splash .field.on{opacity:1}
#splash .veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 46% 58% at 50% 52%,color-mix(in srgb,var(--bg) 55%,transparent),transparent 70%)}
#splash .stage{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;transition:opacity 500ms var(--sease),transform 700ms var(--sease)}
#splash .stage.leave{opacity:0;transform:scale(.985)}
#splash .lang{position:absolute;inset-inline-end:28px;top:22px;font-size:13px;color:var(--ink2);text-decoration:none;padding:6px 8px;border-radius:6px;opacity:0;animation:sFade 600ms var(--sease) 2200ms both}

#splash .lockup{--wh:58px;display:flex;align-items:center;gap:calc(var(--wh)*.156);margin-bottom:28px;direction:ltr;opacity:0;animation:sFade 800ms var(--sease) 200ms both}
#splash .lockup .word{height:calc(var(--wh)*.45);width:auto;display:block}
#splash .lockup .wheel{width:var(--wh);height:var(--wh);display:block;animation:spin 360s linear infinite;transform-origin:50% 50%}
:root[data-theme="dark"] #splash .lockup,:root:not([data-theme="light"]) #splash .lockup{background:#fff;border-radius:12px;padding:12px 16px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #splash .lockup{background:none;padding:0}}
:root[data-theme="light"] #splash .lockup{background:none;padding:0}
#splash .eyebrow{font-size:11px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:18px;opacity:0;animation:sTrack 900ms var(--sease) 500ms both}
@keyframes sTrack{from{opacity:0;letter-spacing:.1em}to{opacity:1;letter-spacing:.2em}}
#splash .title{display:flex;flex-direction:column;align-items:center}
#splash h1{margin:0;font-size:clamp(44px,6vw,72px);line-height:1;font-weight:600;letter-spacing:-1.5px;display:flex;justify-content:center;direction:ltr}
#splash h1 .l{display:inline-block;overflow:hidden;line-height:1.05;padding-bottom:.06em}

@keyframes sRise{to{transform:none}}
#splash .ar-name{font-family:var(--font-ar-display);font-size:clamp(28px,3.4vw,40px);font-weight:600;color:var(--ink);margin-top:10px;line-height:1.4;clip-path:inset(0 0 0 100%);animation:sWipe 560ms var(--sease) 1100ms both}
@keyframes sWipe{to{clip-path:inset(0 0 0 0)}}
#splash .rule{width:56px;height:1px;background:var(--gold);margin:26px 0 24px;transform:scaleX(0);animation:sDraw 520ms var(--sease) 1300ms both}
@keyframes sDraw{to{transform:scaleX(1)}}
#splash .slogan{margin:0 0 30px;font-size:16px;color:var(--ink2);line-height:1.7}
#splash .slogan .ln{display:block}

@keyframes sWord{to{opacity:1;transform:none}}
#splash .start{position:relative;height:54px;padding:0 42px;border-radius:999px;background:var(--green);color:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:12px;overflow:hidden;opacity:0;transform:translateY(12px);animation:sBtn 700ms var(--sease) 1900ms both;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--green) 70%,transparent);transition:background 200ms}
#splash .start:hover{background:var(--green-ink)}
#splash .start:focus-visible{outline-offset:4px}
#splash .start svg{width:16px;height:16px;transition:transform 220ms var(--sease)}
#splash .start:hover svg{transform:translateX(4px)}
html[dir="rtl"] #splash .start:hover svg{transform:translateX(-4px)}
#splash .start::after{content:'';position:absolute;inset:-20% -40%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sSweep 900ms var(--sease) 2300ms both}
#splash .start:hover::after{animation:sSweep 900ms var(--sease) both}
@keyframes sSweep{to{transform:translateX(120%)}}
@keyframes sBtn{to{opacity:1;transform:none}}
#splash .hint{margin-top:10px;font-size:11px;color:var(--ink3);opacity:0;animation:sFade 600ms var(--sease) 2100ms both}
#splash .foot{padding:18px 28px;text-align:center;font-size:11px;color:var(--ink3);opacity:0;animation:sFade 600ms var(--sease) 2200ms both;position:relative}
#splash .foot b{color:var(--ink2);font-weight:600}
#splash .endorse{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.02em;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:8px;direction:ltr}
#splash .endorse i{width:1px;height:12px;background:var(--gold);display:inline-block}
#splash .endorse [lang=ar]{font-family:var(--font-ar-display)}
@keyframes sFade{to{opacity:1}}
#splash.fast .stage *{animation-duration:1ms!important;animation-delay:0ms!important}
#splash.fast .lockup .wheel{animation:spin 360s linear infinite!important}
@media (prefers-reduced-motion:reduce){#splash .stage *{animation-duration:1ms!important;animation-delay:0ms!important}#splash .lockup .wheel{animation:none!important}}

@media (max-height:620px){#splash .lockup{margin-bottom:14px}#splash .rule{margin:14px 0}#splash .slogan{margin-bottom:14px}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- Search ---------------- */
const AR_DIAC = /[ً-ْٰـۖ-ۭ]/g;

      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) cur[j] = Math.min(cur[j], prev[j - 1]);
      rowMin = Math.min(rowMin, cur[j]);

const Search = {
  idx: [],
  build() {
    this.idx = Store.published().map(c => {
      const sec = Store.section(c.s), sub = Store.sub(c.s, c.ss);
      const text = [c.en, c.ar, (c.tags || []).join(' '), c.cond?.en, c.cond?.ar, sec?.en, sec?.ar, sub?.en, sub?.ar].join(' ');
      const n = norm(text);
      return { id: c.id, n, toks: Array.from(new Set(n.split(' ').filter(Boolean))) };
    });
  },
  expand(q) {
    const syn = Store.bank.synonyms || {};
    return norm(q).split(' ').filter(Boolean).map(tok => {
      const alts = [tok];
      if (syn[tok]) alts.push(norm(syn[tok]));
      return alts;
    });
  },
  run(q) {
    const terms = this.expand(q); if (!terms.length) return { hits: [], terms };
    const qn = norm(q);
    const scored = [];
    for (const e of this.idx) {
      let score = 0, matchedAll = true, matchedAny = false;
      for (const alts of terms) {
        let best = 0;
        for (const a of alts) {
          if (!a) continue;
          if (e.toks.includes(a)) best = Math.max(best, 16);
          else if (e.n.includes(' ' + a) || e.n.startsWith(a)) best = Math.max(best, 12);
          else if (a.length >= 3 && e.n.includes(a)) best = Math.max(best, 7);
          else if (a.length >= 4) {

/* ---------------- Clipboard ---------------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}

    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------------- Rendering: text with tokens ---------------- */

}

  history(id) {
    const c = Store.comment(id); if (!c) return;
    const diff = (a, b) => { // word-level LCS diff
      const A = (a || '').split(/(\s+)/), B = (b || '').split(/(\s+)/); const m = A.length, n = B.length; const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      let i = 0, j = 0, out = ''; while (i < m && j < n) { if (A[i] === B[j]) { out += h(A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { out += `<del>${h(A[i])}</del>`; i++; } else { out += `<ins>${h(B[j])}</ins>`; j++; } }
      while (i < m) out += `<del>${h(A[i++])}</del>`; while (j < n) out += `<ins>${h(B[j++])}</ins>`; return out;
    };
    const d = openDialog(`<div class="dlg-h"><h3>History · ${h(id)}</h3><span class="sp"></span><button class="ib" data-close>${I.x}</button></div>
      <div class="dlg-b">${c.history.length ? c.history.map((hs, i) => `<div class="hist"><div class="hh"><b>v${c.history.length - i}</b><span class="vtag">${new Date(hs.at).toLocaleString()} · ${h(hs.by || '')}</span><span class="sp"></span><button class="btn sec" data-restore="${i}">Restore this version</button></div>
        <div class="hb diff"><div class="en">${diff(hs.en, c.en)}</div><div class="ar" dir="rtl" lang="ar">${diff(hs.ar, c.ar)}</div></div></div>`).join('') : '<p class="note">No earlier versions.</p>'}</div>`, 'wide');
    d.addEventListener('click', e => {
      const i = e.target.closest('[data-restore]')?.dataset.restore; if (i == null) return;
      const hs = c.history[i]; const snap = { at: nowIso(), by: Store.user.name || 'admin', en: c.en, ar: c.ar, cond: c.cond, kind: c.kind, status: c.status, tags: c.tags };
      Object.assign(c, { en: hs.en, ar: hs.ar, cond: hs.cond, kind: hs.kind, tags: hs.tags }); c.history.unshift(snap); c.updatedAt = nowIso();
      Store.save(); Search.build(); toast('Restored'); d.close(); this.render($('#main'));
    });
  },

      if (g('cond_en') || g('cond_ar')) patch.cond = { en: g('cond_en') || '', ar: g('cond_ar') || '' }; if (g('doc_en') || g('doc_ar')) patch.doc = { en: g('doc_en') || '', ar: g('doc_ar') || '' };
      if (c) { const changed = Object.keys(patch).some(k => JSON.stringify(c[k]) !== JSON.stringify(patch[k])); if (!changed) return; c.history.unshift({ at: nowIso(), by: Store.user.name || 'csv', en: c.en, ar: c.ar, cond: c.cond, kind: c.kind, status: c.status, tags: c.tags }); Object.assign(c, patch, { updatedAt: nowIso() }); report.updated.push(id); }

  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); Composer.copy(); return; }

  if (e.key === 'Escape') { if (document.activeElement.id === 'q' && UI.q) { UI.q = ''; $('#q').value = ''; renderMain(); } else if (document.body.classList.contains('tray-open')) document.body.classList.remove('tray-open'); else { document.activeElement.blur(); } return; }
  if (typing) return;
  if (e.key === '/' ) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === '?' && document.activeElement.id !== 'q') { helpDialog(); return; }
  if (e.key.toLowerCase() === 'p' && document.activeElement.id !== 'q' && !e.ctrlKey && !e.metaKey) { Present.toggle(); return; }
  if (UI.view === 'admin') return;
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(UI.visible.length - 1, UI.active + 1)); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, UI.active - 1)); return; }
  if (e.key === 'Enter' && UI.active >= 0) { e.preventDefault(); Composer.add(UI.visible[UI.active]); return; }
  if (e.key === ' ' && UI.active >= 0 && document.activeElement.id !== 'q') { e.preventDefault(); previewDialog(UI.visible[UI.active]); return; }
  if (/^[1-9]$/.test(e.key) && document.activeElement.id !== 'q' && !UI.q) { const s = Store.sectionsOf(Store.user.svc)[Number(e.key) - 1]; if (s) $(`#sec-${s.id}`)?.scrollIntoView({ behavior: 'smooth' }); return; }
});
document.addEventListener('focusin', e => { const card = e.target.closest?.('.card'); if (card) { const i = UI.visible.indexOf(card.dataset.id); if (i >= 0) setActive(i, false); } });

/* ---------------- Self test ---------------- */
function selfTest(silent) {
  const R = []; const ok = (name, cond, extra = '') => R.push({ name, pass: !!cond, extra });
  ok('norm: hamza/taa/yaa', norm('أحمد الإمارة إلى') === 'احمد الاماره الي');
  ok('norm: diacritics + tatweel', norm('يُرجـــى') === 'يرجي');
  ok('norm: arabic digits', norm('٢٥%') === '25%');
  ok('tokens: extraction', JSON.stringify(tokensOf('a {{tin}} b {{ tradeLicenseNo }} {{tin}}')) === '["tin","tradeLicenseNo"]');
  const expected = { 'entity-type': 19, doi: 8, natural: 6, commence: 1, authority: 12, 'tl-number': 2, 'issue-date': 2, 'expiry-date': 6, names: 2, activity: 1, owners: 8, 'branch-main': 4, address: 6, 'signatory-list': 3, 'tin-main': 1, dereg: 5, 'change-type': 1 };
  for (const [ss, n] of Object.entries(expected)) { const got = EMBED.comments.filter(c => c.ss === ss).length; ok(`seed: ${ss} = ${n}`, got === n, got !== n ? `got ${got}` : ''); }
  ok('seed: total 87', EMBED.comments.length === 87, `got ${EMBED.comments.length}`);
  ok('seed: unique ids', new Set(EMBED.comments.map(c => c.id)).size === EMBED.comments.length);
  ok('seed: every comment maps to a subsection', EMBED.comments.every(c => Store.sub(c.s, c.ss)));
  ok('seed: EN/AR token parity', EMBED.comments.every(c => !c.ar || JSON.stringify(tokensOf(c.en).sort()) === JSON.stringify(tokensOf(c.ar).sort())));
  const first = q => Search.run(q).hits[0]?.id; const has = (q, id) => Search.run(q).hits.some(x => x.id === id);
  ok('search: "expired eid" → np-04', first('expired eid') === 'np-04', first('expired eid'));
  ok('search: "هوية منتهية" → np-04', first('هوية منتهية') === 'np-04', first('هوية منتهية'));
  ok('search: "moa" finds doi-05', has('moa', 'doi-05'));
  ok('search: "jafza" finds au-08 & led-06', has('jafza', 'au-08') && has('jafza', 'led-06'));
  ok('search: typo "incorporaton" finds doi-01', has('incorporaton', 'doi-01'));
  ok('search: "رخصه منتهيه" finds led-03', has('رخصه منتهيه', 'led-03') || has('رخصه حديثه', 'led-03'));
  const t0 = performance.now(); for (let i = 0; i < 200; i++) Search.run(['expired eid', 'moa', 'هوية', 'trade licence number', 'rejected sole'][i % 5]); const per = (performance.now() - t0) / 200;
  ok(`perf: search ${per.toFixed(2)} ms avg (< 50)`, per < 50);
  const saved = { items: Composer.items, values: Composer.values, opts: { ...Composer.opts } };
  Composer.items = ['lid-02', 'np-04']; Composer.values = { date: '2026-01-15' }; Composer.opts = { lang: 'both', format: 'numbered', opener: false, closer: false };
  const out = Composer.text();
  ok('composer: numbered EN then AR', out.startsWith('1. Kindly amend the license issue date to (15/01/2026).\n2. Kindly attach') && out.includes('\n\n‏1. يرجى تعديل تاريخ اصدار الرخصة الى (15/01/2026).'), JSON.stringify(out.slice(0, 80)));
  Composer.opts.lang = 'inter'; const out2 = Composer.text();
  ok('composer: interleaved pairs', out2.split('\n\n').length === 2 && out2.includes('\n‏يرجى'));
  Composer.items = ['dr-01', 'dr-02']; ok('guard: multiple rejections', Composer.warnings().some(w => w.m === t('w_multi_rej')));
  Composer.items = ['dr-01', 'ad-01']; ok('guard: mix rejection + request', Composer.warnings().some(w => w.m === t('w_mix')));
  Object.assign(Composer, saved); Composer.render();
  const html = buildHtml(Store.bank); ok('publish: self-serialisation round-trips', html.includes('id="bank"') && html.includes('"comments"') && /<div id="app"><\/div>/.test(html), `${(html.length / 1024).toFixed(0)} KB`);
  ok('sha256: known vector', sha256('admin') === '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918');
  ok('brand: three logo assets embedded', [FTA_LOGO, FTA_WHEEL, FTA_TEXT].every(x => x.startsWith('data:image/png;base64,') && x.length > 8000));
  ok('brand: accent is the logo green', getComputedStyle(document.documentElement).getPropertyValue('--green').trim().toLowerCase() === (matchMedia('(prefers-color-scheme:dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark' ? '#25a15c' : '#00843d'));
  ok('field: WebGL shader compiled (or graceful fallback)', !Field.gl || Field.gl.getProgramParameter(Field.prog, Field.gl.LINK_STATUS));
  ok('field: frame time under 16.7 ms', (() => { if (!Field.gl) return true; const t0 = performance.now(); for (let i = 0; i < 30; i++) Field.draw(i / 60); Field.gl.finish?.(); return (performance.now() - t0) / 30 < 16.7; })());
  ok('home: at most 9 elements', (() => { Splash.render(); const n = $$('#splash .stage > *, #splash .col > *').filter(x => !x.classList.contains('col')).length; return n <= 9; })(), String($$('#splash .stage > *, #splash .col > *').length - 1));
  ok('services: 27 unique in Registration file', EMBED.services.length === 27 && new Set(EMBED.services.map(x => x.id)).size === 27 && EMBED.area.en === 'Registration');
  ok('services: every section belongs to a service', EMBED.sections.every(x => EMBED.services.some(sv => sv.id === x.svc)));
  ok('services: scenarios carry a valid service', EMBED.scenarios.every(x => EMBED.services.some(sv => sv.id === x.svc)));
  ok('services: AMTP bank under Tax Records Amendment', Store.svcCount('tax-records-amendment') === Store.published().length);
  ok('scenarios: all ids resolve', EMBED.scenarios.length >= 8 && EMBED.scenarios.every(sc => sc.ids.every(id => EMBED.comments.some(c => c.id === id))));
  ok('conflicts: all ids resolve', EMBED.conflicts.every(([a, b]) => EMBED.comments.some(c => c.id === a) && EMBED.comments.some(c => c.id === b)));
  ok('attachments: doc names present', EMBED.comments.filter(c => c.kind === 'attachment').every(c => c.doc?.en && c.doc?.ar));
  const saved2 = { items: Composer.items, values: Composer.values, opts: { ...Composer.opts } };
  Composer.items = ['np-03', 'np-06']; ok('quality: conflict detected', Composer.quality().checks.find(c => c.k === 'conf')?.ok === false);
  Composer.items = ['et-01', 'et-02']; ok('quality: exclusive subsection conflict', Composer.conflicts().length === 1);
  Composer.items = ['np-04', 'doi-05']; Composer.values = {}; Composer.opts = { lang: 'en', format: 'numbered', opener: false, closer: false, attach: true, stamp: false };
  ok('composer: attachment summary', /Required attachments:\n1\) Updated Emirates ID\n2\) Original Memorandum of Association$/.test(Composer.text()), JSON.stringify(Composer.text().slice(-90)));
  Composer.opts.stamp = true; Store.user.name ||= ''; ok('composer: stamp line', Composer.text().includes('Reviewed by '));
  ok('quality: green when clean', (Composer.opts.attach = false, Composer.opts.stamp = false, Composer.quality().level === 'g'));
  Composer.items = ['np-04', 'np-04']; ok('quality: duplicate detection', Composer.duplicates().length === 1);
  Object.assign(Composer, saved2);
  const cl = computeChangelog(EMBED, { comments: [...EMBED.comments.map(c => c.id === 'ad-01' ? { ...c, en: c.en + ' now' } : c), { id: 'zz', status: 'published', en: 'x', ar: '' }].filter(c => c.id !== 'ad-02') });
  ok('changelog: added/changed/archived', cl.added.length === 1 && cl.changed.length === 1 && cl.archived.includes('ad-02'));
  const csv = csvOf([['a', 'b'], ['1,2', 'q"uo"te'], ['عربي', 'line\nbreak']]); const back = parseCsv(csv); ok('csv: round-trip', back.length === 3 && back[1][0] === '1,2' && back[1][1] === 'q"uo"te' && back[2][1] === 'line\nbreak');
  ok('palette: actions available', Palette.actions().length >= 13 + EMBED.scenarios.length);
  ok('placeholders: recent values store', Array.isArray(Store.user.recentValues.date || []));
  ok('version compare', cmpVer('1.10.0', '1.9.0') > 0 && cmpVer('1.0.0', '1.0.0') === 0);
  ok('review: typography proposals keep tokens', EMBED.reviewItems.filter(r => r.type === 'typography').every(r => { const c = EMBED.comments.find(x => x.id === r.commentId); return JSON.stringify(tokensOf(c.en).sort()) === JSON.stringify(tokensOf(r.proposal.ar).sort()); }));
  if (silent) { window.__selftest = R; return R; }
  const pass = R.filter(r => r.pass).length;
  const box = document.createElement('div'); box.className = 'selftest'; box.innerHTML = `<h4>Self-test · ${pass}/${R.length} passed</h4>` + R.map(r => `<div><span class="${r.pass ? 'ok' : 'fail'}">${r.pass ? '✓' : '✗'}</span><span>${h(r.name)}</span><span class="vtag" style="margin-inline-start:auto">${h(r.extra)}</span></div>`).join('') + `<div style="border:0;margin-top:8px"><button class="btn sec" onclick="this.closest('.selftest').remove()">Close</button></div>`;
  document.body.appendChild(box);
  window.__selftest = R;
}

window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

Store.load(); LANG = Store.user.lang; (() => { const l = $('link[rel="icon"]'); if (l) l.href = FTA_WHEEL; })(); document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr'; applyTheme();
Search.build(); const restored = Composer.restore(); renderShell(); if (restored) setTimeout(() => toast(t('draft_restored')), 600);
$('#main').addEventListener('scroll', debounce(spy, 60));
if (!Store.user.skipSplash && location.hash !== '#selftest') Splash.show(); else $('#q').focus();
if (location.hash === '#selftest') setTimeout(selfTest, 50);
window.Mudawwana = { Store, Search, Composer, Splash, Field, Services, Scenarios, Palette, Tour, Present, Print, Admin, norm, selfTest, buildHtml, computeChangelog, csvOf, parseCsv };
})();
