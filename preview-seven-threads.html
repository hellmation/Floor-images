<style>
:root{--bg:#F6F3EC;--ink:#1C1B19;--ink2:#5B5750;--ink3:#8E897F;--green:#009247;--green-ink:#006B34;--gold:#B5985A;--font:'IBM Plex Sans','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
:root[data-theme=dark]{--bg:#0F0F0E;--ink:#ECE7DC;--ink2:#B3ADA0;--ink3:#7C7669;--green:#1FA862;--green-ink:#7FD6A6;--gold:#CBB078}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 900ms ease}
#field.on{opacity:1}
#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 46% 58% at 50% 52%,color-mix(in srgb,var(--bg) 55%,transparent),transparent 70%)}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;transition:opacity 500ms var(--ease),transform 700ms var(--ease)}
#stage.leave{opacity:0;transform:scale(.985)}
.lang{position:absolute;inset-inline-end:28px;top:22px;font-size:13px;color:var(--ink2);text-decoration:none;padding:6px 8px;opacity:0;animation:fade 600ms var(--ease) 2200ms both}
.theme{position:absolute;inset-inline-start:28px;top:22px;font-size:13px;color:var(--ink2);background:none;border:0;cursor:pointer;font:inherit;opacity:0;animation:fade 600ms var(--ease) 2200ms both}
.col{align-self:center;justify-self:center;width:min(680px,calc(100vw - 48px));display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:4vh;will-change:transform}
.lockup{--wh:58px;display:flex;align-items:center;gap:calc(var(--wh)*.156);margin-bottom:28px;direction:ltr;opacity:0;animation:fade 800ms var(--ease) 200ms both}
:root[data-theme=dark] .lockup{background:#fff;border-radius:12px;padding:12px 16px}
.lockup .word{height:calc(var(--wh)*.45);display:block}
.lockup .wheel{width:var(--wh);height:var(--wh);display:block;animation:spin 360s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font-size:11px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:18px;letter-spacing:.1em;opacity:0;animation:track 900ms var(--ease) 500ms both}
@keyframes track{from{opacity:0;letter-spacing:.1em}to{opacity:1;letter-spacing:.2em}}
h1{margin:0;font-size:clamp(44px,6vw,72px);line-height:1;font-weight:600;letter-spacing:-1.5px;display:flex;justify-content:center}
h1 .l{display:inline-block;overflow:hidden;line-height:1.05;padding-bottom:.06em}
h1 .l span{display:inline-block;transform:translateY(110%);animation:rise 760ms var(--ease) both}
@keyframes rise{to{transform:none}}
.ar-name{font-family:'IBM Plex Sans Arabic',var(--font);font-size:clamp(28px,3.4vw,40px);font-weight:500;color:var(--ink);margin-top:10px;line-height:1.4;clip-path:inset(0 0 0 100%);animation:wipe 560ms var(--ease) 1100ms both}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.rule{width:56px;height:1px;background:var(--gold);margin:26px 0 24px;transform:scaleX(0);animation:draw 520ms var(--ease) 1300ms both}
@keyframes draw{to{transform:scaleX(1)}}
.slogan{margin:0 0 30px;font-size:16px;color:var(--ink2);line-height:1.7}
.slogan span.ln{display:block}
.slogan .w{display:inline-block;opacity:0;transform:translateY(6px);animation:wfade 520ms var(--ease) both}
@keyframes wfade{to{opacity:1;transform:none}}
.start{position:relative;height:54px;padding:0 42px;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:15px;font-weight:600;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:12px;overflow:hidden;opacity:0;transform:translateY(12px);animation:btn 700ms var(--ease) 1900ms both;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--green) 70%,transparent);transition:background 200ms}
.start:hover{background:var(--green-ink)}
.start svg{width:16px;height:16px;transition:transform 220ms var(--ease)}
.start:hover svg{transform:translateX(4px)}
.start::after{content:'';position:absolute;inset:-20% -40%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 900ms var(--ease) 2300ms both}
.start:hover::after{animation:sweep 900ms var(--ease) both}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes btn{to{opacity:1;transform:none}}
.hint{margin-top:10px;font-size:11px;color:var(--ink3);opacity:0;animation:fade 600ms var(--ease) 2100ms both}
.foot{padding:18px 28px;text-align:center;font-size:11px;color:var(--ink3);opacity:0;animation:fade 600ms var(--ease) 2200ms both}
.foot b{color:var(--ink2);font-weight:600}
@keyframes fade{to{opacity:1}}
body.fast *{animation-duration:1ms!important;animation-delay:0ms!important}
body.fast .lockup .wheel{animation:spin 360s linear infinite!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0ms!important}}
#app{position:fixed;inset:0;display:none;grid-template-rows:60px 1fr;background:var(--bg)}
#app.show{display:grid;animation:fade 500ms var(--ease) both}
#app .bar{display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);font-weight:600}
#app .bar img{width:28px;height:28px}
#app .bar span{color:var(--ink3);font-weight:400}
#app .body{display:grid;place-items:center;color:var(--ink3);font-size:14px}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div id="veil"></div>
<div id="stage">
  <button class="theme" id="themeBtn">Dark</button>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
/* ---------- text choreography ---------- */
const title = $('#title'); 'Mudawwana'.split('').forEach((ch, i) => { const l = document.createElement('span'); l.className = 'l'; l.innerHTML = `<span style="animation-delay:${700 + i * 32}ms">${ch}</span>`; title.appendChild(l); });
const words = (el, text, t0) => { text.split(' ').forEach((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w; s.style.animationDelay = (t0 + i * 45) + 'ms'; el.appendChild(s); el.appendChild(document.createTextNode(' ')); }); };
words($('#sl1'), 'Clear comments. Consistent cases. In seconds.', 1500); words($('#sl2'), 'تعليقات واضحة، حالات متسقة، في ثوانٍ.', 1750);

/* ---------- Seven Threads field (WebGL) ---------- */
const cv = $('#field'); const gl = cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });
let dark = matchMedia('(prefers-color-scheme:dark)').matches; if (location.hash.includes('dark')) dark = true; if (location.hash.includes('light')) dark = false;
document.documentElement.dataset.theme = dark ? 'dark' : 'light';
const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS = `precision highp float;
uniform vec2 R;uniform float T;uniform vec2 M;uniform float MS;uniform float CONV;uniform float DARK;uniform vec2 WH;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 uv=gl_FragCoord.xy/R; float asp=R.x/R.y;
  // diagonal thread space, like the bands of the wheel
  float ang=-0.32; mat2 rot=mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
  vec2 q=rot*vec2((uv.x-0.5)*asp,uv.y-0.5);
  // pointer displacement (fabric in air)
  vec2 mq=rot*vec2((M.x-0.5)*asp,M.y-0.5); float md=length(q-mq); float push=exp(-md*md*22.)*0.035*MS;
  // wheel attraction
  vec2 wq=rot*vec2((WH.x-0.5)*asp,WH.y-0.5); float wd=length(q-wq); float bend=exp(-wd*wd*60.)*0.02;
  vec3 col=vec3(0.); float acc=0.;
  vec3 pal[7];
  pal[0]=vec3(0.78,0.66,0.40); pal[1]=vec3(0.10,0.62,0.36); pal[2]=vec3(0.30,0.29,0.27); pal[3]=vec3(0.86,0.25,0.26); pal[4]=vec3(0.18,0.50,0.32); pal[5]=vec3(0.88,0.80,0.60); pal[6]=vec3(0.42,0.40,0.37);
  for(int i=0;i<7;i++){
    float fi=float(i); float ph=fi*1.7;
    float base=-0.42+fi*0.14;
    float y=base+0.08*sin(q.x*1.6+T*0.045+ph)+0.045*sin(q.x*3.1-T*0.03+ph*2.3)+0.02*noise(vec2(q.x*2.+fi,T*0.02));
    y+=push*sign(q.y-y)+bend*sign(q.y-y);
    y=mix(y,0.0,CONV*CONV);
    float w=0.012+0.009*sin(q.x*2.2+T*0.05+ph)+0.004*noise(vec2(q.x*5.+fi*3.,T*0.03));
    w*=1.0-0.7*CONV;
    float d=abs(q.y-y);
    float body=1.0-smoothstep(w*0.55,w,d);
    float sh=sqrt(max(0.,1.0-pow(d/max(w,1e-4),2.)));
    float light=0.55+0.45*sh*(0.6+0.4*sign(q.y-y));
    float a=body*(0.11+0.07*sin(q.x*0.9+T*0.02+ph))*(1.0+DARK*0.9)*(1.0-CONV*0.9);
    vec3 c=mix(pal[i],vec3(1.0),DARK*0.55)*light;
    col=col*(1.0-a)+c*a; acc=acc+a*(1.0-acc);
  }
  // grain + vignette
  float g=(hash(gl_FragCoord.xy+fract(T))-0.5)*0.03;
  float vig=smoothstep(1.3,0.35,length(uv-0.5));
  float alpha=clamp(acc*vig+abs(g),0.,1.);
  vec3 outc=col+g;
  gl_FragColor=vec4(outc*alpha,alpha);
}`;
function sh(t, src) { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n); const uR = U('R'), uT = U('T'), uM = U('M'), uMS = U('MS'), uC = U('CONV'), uD = U('DARK'), uW = U('WH');
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
let mouse = [0.5, 0.5], mTarget = [0.5, 0.5], ms = 0, conv = 0, convT = 0, t0 = performance.now(), frames = [], running = true;
function resize() { const dpr = Math.min(devicePixelRatio || 1, 1.5); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; gl.viewport(0, 0, cv.width, cv.height); }
addEventListener('resize', resize); resize();
addEventListener('pointermove', e => { mTarget = [e.clientX / innerWidth, 1 - e.clientY / innerHeight]; ms = 1; });
function frame(now) {
  if (!running) return; const t = (now - t0) / 1000; const f0 = performance.now();
  mouse[0] += (mTarget[0] - mouse[0]) * 0.08; mouse[1] += (mTarget[1] - mouse[1]) * 0.08; ms += (0 - ms) * 0.02;
  conv += (convT - conv) * 0.08;
  const wr = $('#wheel').getBoundingClientRect(); const wh = [(wr.left + wr.width / 2) / innerWidth, 1 - (wr.top + wr.height / 2) / innerHeight];
  gl.uniform2f(uR, cv.width, cv.height); gl.uniform1f(uT, t); gl.uniform2f(uM, mouse[0], mouse[1]); gl.uniform1f(uMS, Math.max(0, ms)); gl.uniform1f(uC, conv); gl.uniform1f(uD, dark ? 1 : 0); gl.uniform2f(uW, wh[0], wh[1]);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  frames.push(performance.now() - f0); if (frames.length > 180) frames.shift();
  // 1px parallax of the text column
  $('#col').style.transform = `translate(${(mouse[0] - 0.5) * 2}px, ${(0.5 - mouse[1]) * 2}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame); requestAnimationFrame(() => cv.classList.add('on'));
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) requestAnimationFrame(frame); });
window.__frameMs = () => frames.reduce((a, b) => a + b, 0) / Math.max(1, frames.length);

/* ---------- magnetic button ---------- */
const btn = $('#start'); let bx = 0, by = 0, tx = 0, ty = 0;
addEventListener('pointermove', e => { const r = btn.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; const dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy); if (d < 90) { tx = dx / 90 * 6; ty = dy / 90 * 6; } else { tx = 0; ty = 0; } });
(function spring() { bx += (tx - bx) * 0.18; by += (ty - by) * 0.18; btn.style.transform = `translate(${bx}px,${by}px)`; requestAnimationFrame(spring); })();

/* ---------- start transition ---------- */
function start() { convT = 1; $('#stage').classList.add('leave'); setTimeout(() => { $('#app').classList.add('show'); }, 520); setTimeout(() => { cv.classList.remove('on'); }, 700); }
btn.addEventListener('click', start); addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('#themeBtn').addEventListener('click', () => { dark = !dark; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; $('#themeBtn').textContent = dark ? 'Light' : 'Dark'; });
$('#langBtn').addEventListener('click', e => { e.preventDefault(); const ar = document.documentElement.dir !== 'rtl'; document.documentElement.dir = ar ? 'rtl' : 'ltr'; document.documentElement.lang = ar ? 'ar' : 'en'; $('#langBtn').textContent = ar ? 'English' : 'عربي'; $('.eyebrow').textContent = ar ? 'خدمات التسجيل · أداة داخلية' : 'Registration Services · Internal tool'; $('#start').firstChild.textContent = ar ? 'ابدأ ' : 'Start '; $('.hint').textContent = ar ? 'أو اضغط Enter' : 'or press Enter'; $('.foot').innerHTML = ar ? 'تطوير <b>فريق تطوير الخدمات</b> · v2.0 · 2026' : 'Developed by the <b>Service Development Team</b> · v2.0 · 2026'; });
if (location.hash.includes('fast')) document.body.classList.add('fast');
window.__start = start;
})();
</script>
